services:
  - type: web
    name: collections-manager-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -c 'from app import init_db; init_db()' && waitress-serve --listen=0.0.0.0:$PORT app:app
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: owner
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: COLLECTIONS_DB
        value: /tmp/collections-demo.db
      - key: COLLECTIONS_BACKUP_DIR
        value: /tmp/collections-demo-backups
      - key: COOKIE_SECURE
        value: "1"
