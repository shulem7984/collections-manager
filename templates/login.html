<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Collections Manager</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="loginpage"><form method="post" class="loginbox"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="brand darkbrand">◆ Collections<span>Manager</span></div><p class="muted">Sign in to your workspace</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary full">Sign in</button><small>Initial local setup credentials are documented in README.md. Change them before deployment.</small></form></body></html>
